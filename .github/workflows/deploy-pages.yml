name: Deploy to GitHub Pages

# site/ の内容をそのまま GitHub Pages に公開します。
# 事前にリポジトリの Settings → Pages → Source を "GitHub Actions" にしてください。
on:
  push:
    # 既定ブランチが main になったら claude/... の行は削除してよい
    branches:
      - main
      - claude/wordpress-site-clone-ai-itlcmw
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pages 系の 3 つは最新版でも Node 20 のままで、実行時に廃止予定の警告が出る。
      # GitHub が Node 24 対応版を出したら上げること (2026-09 時点で未提供)。
      - uses: actions/configure-pages@v5
        with:
          # Pages が未設定なら自動で有効化を試みる (Source = GitHub Actions)
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
