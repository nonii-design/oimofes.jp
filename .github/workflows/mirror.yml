name: Mirror WordPress site

# GitHub の Actions タブ → "Mirror WordPress site" → "Run workflow" で手動実行します。
# 元サイトを静的 HTML として site/ に複製し、このワークフローを実行したブランチにコミットします。
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 複製元サイトの URL
        default: https://oimofes.jp/
        required: true
      extra_hosts:
        description: 画像等を別ホスト (CDN) から配信している場合のホスト名 (カンマ区切り、任意)
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Mirror site into site/
        env:
          SITE_URL: ${{ inputs.site_url }}
          EXTRA_HOSTS: ${{ inputs.extra_hosts }}
        run: |
          rm -rf site
          bash scripts/mirror.sh

      - name: Fetch lazy-loaded images and other assets wget missed
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: node scripts/fetch-missing.mjs

      - name: Post-process HTML
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: node scripts/postprocess.mjs

      # 元サイトには表示サイズに対して極端に大きな画像が含まれるため、Web 向けに縮小する。
      # (ヘッダーのロゴは 34035x13284px / 8.9MB あり、読み込みが極端に重くなっていた)
      - name: Optimize images
        run: |
          python3 -m pip install --quiet --upgrade Pillow
          python3 scripts/optimize-images.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site PAGES.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: mirror ${{ inputs.site_url }} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
